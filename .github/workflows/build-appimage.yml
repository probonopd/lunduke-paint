name: Build AppImage

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-alpine-x86_64:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base meson ninja pkgconf \
            gtk+3.0-dev gtk+3.0 gtkmm3-dev cairomm-dev pangomm-dev libsigc++-dev \
            gdk-pixbuf-dev gdk-pixbuf \
            libarchive-dev pugixml-dev \
            hicolor-icon-theme \
            git wget xz squashfs-tools desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          meson setup build -Dprefix=/usr
          meson compile -C build

      - name: Install
        run: |
          rm -rf /tmp/lunduke-install
          DESTDIR=/tmp/lunduke-install meson install -C build

      - name: Setup minimal AppDir
        run: |
          chmod +x .github/setup-appdir.sh
          ./.github/setup-appdir.sh

      - name: Download appimagetool
        run: |
          APPIMAGE_URL=$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2)
          wget -c "https://github.com/${APPIMAGE_URL}" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

      - name: Deploy
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool -s deploy .AppDir/org.lunduke.LundukePaint.desktop

      - name: Bundle AppImage
        env:
          ARCH: x86_64
          VERSION: 0.3
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool .AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Lunduke_Paint-alpine-x86_64
          path: Lunduke_Paint-*.AppImage

  build-devuan-x86_64:
    runs-on: ubuntu-latest
    container: devuan/devuan:daedalus
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            meson ninja-build pkg-config \
            libgtk-3-dev libgtkmm-3.0-dev libcairomm-1.0-dev libpangomm-1.4-dev libatkmm-1.6-dev libsigc++-2.0-dev \
            libgdk-pixbuf2.0-dev libgdk-pixbuf2.0-0 \
            libarchive-dev libpugixml-dev \
            git wget file squashfs-tools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          meson setup build -Dprefix=/usr
          meson compile -C build

      - name: Install
        run: |
          rm -rf /tmp/lunduke-install
          DESTDIR=/tmp/lunduke-install meson install -C build

      - name: Setup minimal AppDir
        run: |
          chmod +x .github/setup-appdir.sh
          ./.github/setup-appdir.sh

      - name: Download appimagetool
        run: |
          APPIMAGE_URL=$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2)
          wget -c "https://github.com/${APPIMAGE_URL}" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

      - name: Deploy
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool -s deploy .AppDir/org.lunduke.LundukePaint.desktop

      - name: Bundle AppImage
        env:
          ARCH: x86_64
          VERSION: 0.3
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool .AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Lunduke_Paint-devuan-x86_64
          path: Lunduke_Paint-*.AppImage

  release:
    needs: [build-alpine-x86_64, build-devuan-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.AppImage"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
